name: Weekly data build

on:
  schedule:
    # Mondays 10:47 UTC (about 6:47am Eastern). Zillow and Redfin update weekly/monthly.
    - cron: "47 10 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "coverage.yaml"
      - ".github/workflows/weekly.yml"

permissions:
  contents: write   # commit the Zillow forecast archive
  pages: write
  id-token: write

concurrency:
  group: weekly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Download data and build site files
        run: python -m pipeline.build

      - name: Pasco comps data (parcels, sales, county model)
        # A county failure shouldn't block the market pages from publishing.
        continue-on-error: true
        run: python -u -m pipeline.county_build --county pasco

      - name: Commit new forecast archive (also keeps the schedule active)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          if git diff --cached --quiet; then
            echo "No new archive files."
          else
            git commit -m "Archive Zillow forecast ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
