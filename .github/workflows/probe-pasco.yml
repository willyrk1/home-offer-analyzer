name: Probe Pasco files

# Manual one-off: prints the layout of the Pasco Property Appraiser bulk files
# to the job log so the sales adapter can be written against the real format.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python -m pipeline.probe_pasco
